<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BinsaRRHH</title>
    <script>
      // Aplica el esquema de color antes de pintar, para evitar el destello
      // claro al cargar. Debe coincidir con src/stores/theme.ts.
      (function () {
        try {
          var s = localStorage.getItem('hria.theme')
          if (s !== 'dark') s = 'light'
          if (s === 'dark') document.documentElement.classList.add('hria-dark')
          document.documentElement.style.colorScheme = s
        } catch (e) {
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
