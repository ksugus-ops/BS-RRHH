name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore backend/HRIA.sln

      - name: Verificar formato (quality gate)
        run: dotnet format backend/HRIA.sln --verify-no-changes --verbosity minimal

      - name: Compilar
        run: dotnet build backend/HRIA.sln -c Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test backend/HRIA.sln -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (quality gate)
        run: npm run lint

      - name: Compilar (type-check + build)
        run: npm run build

      - name: Ejecutar pruebas
        run: npm run test
